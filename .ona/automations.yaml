tasks:
  installDeps:
    name: Install dependencies
    description: Install npm dependencies for the Nuxt project.
    command: |
      npm install
    triggeredBy:
      - postDevcontainerStart

services:
  dev:
    name: Nuxt Dev Server
    description: Run the Nuxt development server on port 3000.
    commands:
      start: |
        npm run dev
      ready: |
        curl -sf http://localhost:3000 > /dev/null
