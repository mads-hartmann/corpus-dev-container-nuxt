tasks:
  installDeps:
    name: Install dependencies
    description: Install the Nuxt application dependencies.
    command: npm install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build application
    description: Build the Nuxt application for production.
    command: npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Nuxt development server
    description: Run the Nuxt development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Nuxt development server"
        npm run dev -- --host 0.0.0.0
      ready: curl -f http://localhost:3000
