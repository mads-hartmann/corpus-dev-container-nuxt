tasks:
  installDeps:
    name: Install dependencies
    description: Install the locked npm dependencies for the Nuxt app.
    command: npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build application
    description: Build the Nuxt application for production.
    command: npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Nuxt development server
    description: Run the Nuxt development server on port 3000.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Nuxt development server"
        export ONA_EXPOSED_HOST="$(ona environment port list -o=json | jq -r '.[] | select(.port == 3000) | (.host // (.url | sub("^https?://"; "") | split("/")[0]))' | head -n 1)"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST"
        npm run dev -- --host 0.0.0.0
      ready: curl -fsS http://localhost:3000/
