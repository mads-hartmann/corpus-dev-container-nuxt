tasks:
  install-dependencies:
    name: Install dependencies
    description: Install the locked Node.js dependencies.
    command: npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build application
    description: Build the Nuxt application for production.
    command: npm run build
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies

services:
  nuxt-dev:
    name: Nuxt Dev Server
    description: Run the Nuxt development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Nuxt Dev Server"
        export ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST"
        npm run dev -- --host 0.0.0.0
      ready: curl -fsS http://localhost:3000
